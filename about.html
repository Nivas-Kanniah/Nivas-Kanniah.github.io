<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nivas Kanniah — About</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#071028;
  --panel:#071a2a;
  --card:#0f2640;
  --muted:#9fb0d5;
  --accent:#64ffda;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--muted);
  font-family:'Poppins',sans-serif;
}

/* Header */
header{
  display:flex;
  justify-content:space-between;
  padding:16px 24px;
}
.logo{color:var(--accent);font-weight:700;text-decoration:none}
nav a{margin:0 10px;color:var(--muted);text-decoration:none}
nav a:hover{color:var(--accent)}

/* Layout */
main{
  max-width:1100px;
  margin:20px auto;
  display:grid;
  grid-template-columns:300px 1fr;
  gap:20px;
}

/* Timeline */
.timeline{
  border-left:3px solid #1e3a5f;
  padding-left:20px;
}
.item{
  margin-bottom:20px;
  cursor:pointer;
}
.item h4{margin:0;color:#fff}
.item small{color:#aaa}

/* Details */
.details{
  background:#0f2640;
  padding:20px;
  border-radius:10px;
}
h2{color:var(--accent);margin:0}
ul{padding-left:18px}
</style>
</head>

<body>

<header>
  <a class="logo">Nivas Kanniah</a>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<main>

<div class="timeline" id="timeline"></div>

<div class="details">
  <h2 id="title">Select a role</h2>
  <p id="company"></p>
  <p id="period"></p>
  <ul id="points"></ul>
</div>

</main>

<script>
const DATA = [
  {
    title:"Project Member - IT",
    company:"Curefoods",
    period:"Apr 2026 – Present",
    points:[
      "Managing DNS, DHCP, Active Directory, VPN",
      "Providing L1/L2 support",
      "Handling patching, backups, security policies",
      "Maintaining system uptime"
    ]
  },
  {
    title:"Technical Support Engineer",
    company:"Charles Technologies",
    period:"Oct 2025 – Apr 2026",
    points:[
      "Supported web & mobile apps",
      "Resolved bugs and performance issues",
      "Worked with dev and QA teams",
      "Handled deployments"
    ]
  },
  {
    title:"Technical Support Professional",
    company:"Nimbus Systems",
    period:"Jan 2025 – Oct 2025",
    points:[
      "User support during rollout",
      "Created documentation",
      "Tracked software issues"
    ]
  },
  {
    title:"Cybersecurity Intern",
    company:"NIELIT",
    period:"Jun 2025 – Jul 2025",
    points:[
      "Learned threat detection",
      "Worked on security practices"
    ]
  },
  {
    title:"Student Intern",
    company:"Lenovo",
    period:"Nov 2022",
    points:[
      "Assembly line support",
      "Quality control exposure"
    ]
  }
];

const timeline = document.getElementById("timeline");

DATA.forEach((d,i)=>{
  const div = document.createElement("div");
  div.className="item";
  div.innerHTML=`<h4>${d.title}</h4><small>${d.period}</small>`;
  div.onclick=()=>show(i);
  timeline.appendChild(div);
});

function show(i){
  document.getElementById("title").innerText=DATA[i].title;
  document.getElementById("company").innerText=DATA[i].company;
  document.getElementById("period").innerText=DATA[i].period;

  const ul=document.getElementById("points");
  ul.innerHTML="";
  DATA[i].points.forEach(p=>{
    const li=document.createElement("li");
    li.innerText=p;
    ul.appendChild(li);
  });
}
</script>

</body>
</html>
